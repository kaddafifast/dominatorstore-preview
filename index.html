state.query.toLocaleLowerCase('ru')));document.getElementById('product-grid').innerHTML=selected.map((p,i)=>`<article class=\"product-card ${p.art}\"><button type=\"button\" class=\"product-image\" data-product=\"${p.id}\" aria-label=\"Подробнее: ${p.name}\"><span class=\"product-mini\">${p.category.toUpperCase()}<\/span><span class=\"product-mark ${p.art}\">${p.art==='plus'?'<span>PS<\/span><b>+<\/b>':p.art==='wallet'?'<span>PS<\/span><small>STORE<\/small>':p.art==='xbox'?'<span class=\"xbox-mark\">X<\/span>':p.mark}<\/span><span class=\"product-art-label\">${p.art==='plus'?'EXTRA MEMBERSHIP':p.art==='xbox'?'GAME PASS / ULTIMATE':p.art==='steam'?'ТВОЙ КОШЕЛЁК. ТВОИ ИГРЫ.':p.art==='wallet'?'DIGITAL GIFT CARD':p.art==='telegram'?'PREMIUM MEMBERSHIP':'LISTEN. WITHOUT LIMITS.'}<\/span><span class=\"art-arrow\">↗<\/span><\/button><div class=\"product-info\"><p class=\"product-tag\">${p.tag}<\/p><button type=\"button\" class=\"product-title\" data-product=\"${p.id}\">${p.name}<\/button><p class=\"product-detail\">${p.detail}<\/p><div class=\"product-bottom\"><strong>${money(p.price)}<\/strong><button type=\"button\" class=\"add-button\" data-add=\"${p.id}\" aria-label=\"Добавить ${p.name} в демо-корзину\">${isNight?'+':'↗'}<\/button><\/div><\/div><\/article>`).join('');document.getElementById('empty').hidden=selected.length>0;document.querySelectorAll('[data-filter]').forEach(b=>{const active=b.dataset.filter===state.category;b.classList.toggle('selected',active);if(b.hasAttribute('aria-pressed'))b.setAttribute('aria-pressed',String(active));});announceHeight();}\nconst dialog=document.getElementById('shop-dialog');\nfunction openDialog(html){document.getElementById('dialog-content').innerHTML=html;if(!dialog.open)dialog.showModal();announceHeight();}\nfunction toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('visible'),2500);}\nfunction addProd CARD':p.art==='telegram'?'PREMIUM MEMBERSHIP':'LISTEN. WITHOUT LIMITS.'}<\/span><span class=\"art-arrow\">↗<\/span><\/button><div class=\"product-info\"><p class=\"product-tag\">${p.tag}<\/p><button type=\"button\" class=\"product-title\" data-product=\"${p.id}\">${p.name}<\/button><p class=\"product-detail\">${p.detail}<\/p><div class=\"product-bottom\"><strong>${money(p.price)}<\/strong><button type=\"button\" class=\"add-button\" data-add=\"${p.id}\" aria-label=\"Добавить ${p.name} в демо-корзину\">${isNight?'+':'↗'}<\/button><\/div><\/div><\/article>`).join('');document.getElementById('empty').hidden=selected.length>0;document.querySelectorAll('[data-filter]').forEach(b=>{const active=b.dataset.filter===state.category;b.classList.toggle('selected',active);if(b.hasAttribute('aria-pressed'))b.setAttribute('aria-pressed',String(active));});announceHeight();}\nconst dialog=document.getElementById('shop-dialog');\nfunction openDialog(html){document.getElementById('dialog-content').innerHTML=html;if(!dialog.open)dialog.showModal();announceHeight();}\nfunction toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('visible'),2500);}\nfunction addProduct(id){const item=products.find(p=>p.id===id);if(!item)return;state.cart.push(id);document.querySelectorAll('.cart-count').forEach(el=>el.textContent=String(state.cart.length));toast('Добавлено в демо-корзину: '+item.name);}\nfunction showProduct(id){const p=products.find(p=>p.id===id);if(!p)return;openDialog(`<span class=\"dialog-category\">${p.category}<\/span><h2 id=\"dialog-title\">${p.name}<\/h2><p class=\"dialog-detail\">${p.detail}<\/p><p>${p.description}<\/p><div class=\"region-note\">${p.region}<\/div><div class=\"dialog-price\"><strong>${money(p.price)}<\/strong><small>Условная цена для макета<\/small><\/div><button type=\"button\" class=\"primary-button full\" data-add=\"${p.id}\">В демо-корзину <span>+<\/span><\/button><p class=\"dialog-disclaimer\">Это демонстрация интерфейса. Реальной покупки не будет.<\/p>`);}\nfunction showCart(){const ids=[...new Set(state.cart)];const total=state.cart.reduce((sum,id)=>sum+products.find(p=>p.id===id).price,0);openDialog(`<h2 id=\"dialog-title\">Твоя корзина <span class=\"muted-number\">${state.cart.length}<\/span><\/h2>${ids.length?`<div class=\"cart-items\">${ids.map(id=>{const p=products.find(x=>x.id===id);const qty=state.cart.filter(x=>x===id).length;return `<div class=\"cart-item\"><div><strong>${p.name}<\/strong><small>${p.detail} · ${qty} шт.<\/small><\/div><strong>${money(p.price*qty)}<\/strong><button type=\"button\" data-remove=\"${id}\" aria-label=\"Убрать ${p.name}\">×<\/button><\/div>`;}).join('')}<\/div><div class=\"cart-total\"><span>Итого<\/span><strong>${money(total)}<\/strong><\/div>`:'<p class=\"empty-cart\">Пока пусто. Выбери что-нибудь для следующей игры.<\/p>'}<button type=\"button\" class=\"primary-button full\" disabled>Оплата не подключена<\/button><p class=\"dialog-disclaimer\">Тестовая корзина. Товары и цены демонстрационные.<\/p>`);}\nfunction showSupport(){openDialog('<h2 id=\"dialog-title\">Мы рядом.<\/h2><p>В рабочем магазине здесь появится поддержка в Telegram: помощь с выбором региона, активацией и заказами.<\/p><div class=\"region-note\">Дизайн-концепт: сообщения никуда не отправляются.<\/div><button type=\"button\" class=\"primary-button full\" data-action=\"close\">Понятно <span>↗<\/span><\/button>');}\nroot.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.product){showProduct(button.dataset.product);return;}if(button.dataset.add){addProduct(button.dataset.add);return;}if(button.dataset.remove){state.cart=state.cart.filter(id=>id!==button.dataset.remove);document.querySelectorAll('.cart-count').forEach(el=>el.textContent=String(state.cart.length));showCart();return;}if(button.dataset.filter){state.category=button.dataset.filter;renderProducts();document.getElementById('catalog').scrollIntoView({behavior:'smooth',block:'start'});return;}switch(button.dataset.action){case'home':window.scrollTo({top:0,behavior:'smooth'});break;case'catalog':document.getElementById('catalog').scrollIntoView({behavior:'smooth'});break;case'cart':showCart();break;case'close':dialog.close();break;case'support':showSupport();break;case'reset':state.category='Все';state.query='';document.querySelector('.search input').value='';renderProducts();break;case'login':openDialog('<h2 id=\"dialog-title\">Вход через Telegram<\/h2><p>Здесь будет авторизация и история покупок. В этом концепте подключение к аккаунтам отключено.<\/p><div class=\"region-note\">Не вводи логин, пароль или код подтверждения.<\/div><button type=\"button\" class=\"primary-button full\" data-action=\"close\">Вернуться в магазин ↗<\/button>');break;case'how':openDialog('<h2 id=\"dialog-title\">Три шага до игры.<\/h2><ol class=\"how-list\"><li><strong>Выбери товар<\/strong><span>Платформа, подписка или пополнение.<\/span><\/li><li><strong>Проверь условия<\/strong><span>Регион, срок и способ активации.<\/span><\/li><li><strong>Получи заказ<\/strong><span>Код или результат подключения — в личном кабинете.<\/span><\/li><\/ol><p class=\"dialog-disclaimer\">Здесь показан будущий сценарий. Оплата не подключена.<\/p>');break;case'about':case'demo':openDialog('<h2 id=\"dialog-title\">DominatorStore<\/h2><p>Визуальная концепция магазина цифровых товаров для сообщества Dominator. Все цены, состав каталога и условия в этом макете условные.<\/p><p>Это не запущенный магазин: платёжная система, поставщики, авторизация и реальная выдача не подключены.<\/p><button type=\"button\" class=\"primary-button full\" data-action=\"close\">Продолжить просмотр ↗<\/button>');break;}});\ndialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});\ndocument.querySelector('.search input').addEventListener('input',event=>{state.query=event.target.value;renderProducts();});\nfunction announceHeight(){if(window.parent!==window){requestAnimationFrame(()=>window.parent.postMessage({type:'dominator-height',height:document.body.scrollHeight},location.origin==='null'?'*':location.origin));}}\nrenderProducts();new ResizeObserver(announceHeight).observe(document.body);window.addEventListener('load',announceHeight);window.addEventListener('resize',announceHeight);\n})();\n<\/script><\/body><\/html>\n"};
const frame=document.getElementById('preview'),holder=document.getElementById('preview-frame');
